name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: digital_twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d digital_twin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: postgresql+asyncpg://ci:ci@localhost:5432/digital_twin
      BOT_TOKEN: "111:ci_dummy"
      LLM_BASE_URL: "http://127.0.0.1:8080/v1"
      EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"  # lighter model for CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tesseract (for OCR-related imports)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format (check only)
        run: ruff format --check .

      - name: Mypy
        run: mypy src/

      - name: Alembic migration syntax check
        run: alembic upgrade head --sql > /dev/null

      - name: Pytest
        run: pytest -q

      - name: Bandit (security)
        run: bandit -r src/ -ll

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
