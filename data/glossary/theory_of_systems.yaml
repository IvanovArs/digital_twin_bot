# Glossary for subject "theory_of_systems" (Theory of Information Systems).
# Synced into the DB at bot startup (upsert by (subject_slug, term)).
# Admins can also add/edit terms via bot in later versions.

terms:
  - term: Система
    category: Основы ТИС
    definition: Множество элементов, находящихся в отношениях и связях друг с другом, образующих определённую целостность.

  - term: Организация
    category: Основы ТИС
    definition: Группа людей, сознательно объединившихся для достижения общей цели (Мескон, Альберт, Хедоури).

  - term: Системно-целевой подход
    category: Методология
    definition: Подход «сверху», основанный на исследовании целей, для реализации которых создаётся организация.

  - term: Пространство инициирования целей (ПИЦ)
    category: Анализ среды
    definition: Признак структуризации из методики Перегудова-Ямпольского — включает элементы НС, АС, СС, ПС.

  - term: Стейкхолдер
    category: Управление
    definition: Группа или индивидуум, который может оказать влияние на достижение организацией своих целей (Р. Фриман).

  - term: Надсистема (НС)
    category: Анализ среды
    definition: Элемент «пространства инициирования целей» — государственные институты, законы, регулирующие органы, влияющие на организацию.

  - term: Актуальная среда (АС)
    category: Анализ среды
    definition: Элемент ПИЦ — партнёры, конкуренты, поставщики, клиенты организации.

  - term: Собственно система (СС)
    category: Анализ среды
    definition: Элемент ПИЦ — система организационного управления (структура, культура, процессы, документация).

  - term: Подведомственные системы (ПС)
    category: Анализ среды
    definition: Элемент ПИЦ — основная деятельность, ресурсы организации (кадры, оборудование, сырьё).

  - term: SWOT-анализ
    category: Методология
    definition: "Метод анализа среды: Strengths (сильные стороны), Weaknesses (слабые стороны), Opportunities (возможности), Threats (угрозы)."

  - term: STEP-анализ
    category: Методология
    definition: "Метод анализа внешней среды: Social, Technological, Economic, Political (социальные, технологические, экономические, политические факторы)."

  - term: Методика Кошарского-Уёмова
    category: Методики структуризации
    definition: Методика структуризации на основе двойственного определения системы (факторное и процедурное представление).

  - term: Методика Волковой-Четверикова
    category: Методики структуризации
    definition: Методика структуризации на основе концепции деятельности (сферы деятельности, виды деятельности).

  - term: Корпоративная культура
    category: Организация
    definition: Совокупность артефактов, провозглашаемых ценностей и базовых представлений организации (по Э. Шейну).

  - term: Миссия организации
    category: Организация
    definition: Декларируемое предназначение организации, её основная стратегическая цель.

  - term: Цель (системы)
    category: Основы ТИС
    definition: Желаемое будущее состояние системы, ради достижения которого организуются её элементы и связи.

  - term: Функция (системы)
    category: Основы ТИС
    definition: Способ проявления свойств системы во взаимодействии со средой, отражающий её назначение и поведение.

  - term: Структура (системы)
    category: Основы ТИС
    definition: Совокупность устойчивых связей и отношений между элементами системы, обеспечивающих её целостность.

  - term: Подсистема
    category: Основы ТИС
    definition: Часть системы, сама обладающая признаками системы и выполняющая определённую функцию в составе целого.

  - term: Иерархия
    category: Основы ТИС
    definition: Принцип организации системы, при котором элементы и подсистемы расположены по уровням соподчинённости.

  - term: Эмерджентность
    category: Свойства систем
    definition: Наличие у системы свойств, не сводимых к сумме свойств её отдельных элементов.

  - term: Целостность
    category: Свойства систем
    definition: Свойство системы, при котором её качества не являются простой суммой качеств составляющих элементов.

  - term: Открытая система
    category: Основы ТИС
    definition: Система, активно обменивающаяся с внешней средой веществом, энергией и информацией.

  - term: Закрытая система
    category: Основы ТИС
    definition: Система, не обменивающаяся с внешней средой веществом, энергией или информацией (идеализация).

  - term: Обратная связь
    category: Управление
    definition: Передача информации о состоянии выхода системы обратно на её вход для коррекции управляющих воздействий (Н. Винер).

  - term: Гомеостаз
    category: Свойства систем
    definition: Способность системы поддерживать устойчивость внутренних параметров при изменениях внешней среды.

  - term: "Чёрный ящик"
    category: Методология
    definition: Модель системы, в которой известны только её входы и выходы, а внутреннее устройство не рассматривается.

  - term: Жизненный цикл системы
    category: Основы ТИС
    definition: Последовательность стадий существования системы от замысла и создания до эксплуатации и вывода из неё.

  - term: Энтропия (системы)
    category: Свойства систем
    definition: Мера неопределённости или неупорядоченности состояния системы, снижаемая за счёт поступления информации.

  - term: Адаптация
    category: Свойства систем
    definition: Способность системы изменять свою структуру и поведение для сохранения функционирования в меняющейся среде.

  - term: Управление (в системах)
    category: Управление
    definition: Целенаправленное воздействие на систему для перевода её из одного состояния в другое или поддержания заданного режима.

  - term: Информация
    category: Основы ТИС
    definition: Сведения об объектах и явлениях, уменьшающие неопределённость знаний о них у получателя.

  - term: Информационная система (ИС)
    category: Основы ТИС
    definition: Взаимосвязанная совокупность средств, методов и персонала для хранения, обработки и выдачи информации в интересах достижения цели.

  - term: Жизненный цикл ИС
    category: Основы ТИС
    definition: Совокупность стадий разработки, внедрения, эксплуатации и сопровождения информационной системы (регламентирован ГОСТ 34 и ISO/IEC 12207).

  - term: Бизнес-процесс
    category: Организация
    definition: Устойчивая целенаправленная совокупность взаимосвязанных действий, преобразующая входы в выходы, ценные для потребителя.

  - term: Декомпозиция
    category: Методология
    definition: Разделение системы или задачи на более простые составные части для их последующего анализа.

  - term: Агрегирование
    category: Методология
    definition: Объединение элементов или подсистем в более крупные образования с учётом их связей и общих свойств.

  - term: Закономерность системы
    category: Свойства систем
    definition: Устойчивая существенная связь между элементами системы или между системой и средой, проявляющаяся при определённых условиях.

  - term: Свойство системы
    category: Свойства систем
    definition: Сторона системы, обусловливающая её отличие от других систем или сходство с ними и проявляющаяся во взаимодействии.

  - term: Системный подход
    category: Методология
    definition: Общенаучный подход, рассматривающий объект исследования как целостную систему взаимосвязанных элементов.

  - term: Системный анализ
    category: Методология
    definition: Методология исследования сложных слабоструктурированных проблем с применением системного подхода и формальных методов.

  - term: Дерево целей
    category: Методики структуризации
    definition: Иерархическая структура целей системы, в которой цели верхнего уровня декомпозируются на подцели (Ч. Черчмен, Р. Акофф).

  - term: Кибернетика
    category: Методология
    definition: Наука об общих закономерностях управления и передачи информации в машинах, живых организмах и обществе (Н. Винер, 1948).

  - term: Синтез и анализ
    category: Методология
    definition: "Две взаимодополняющие познавательные процедуры: анализ расчленяет систему на части, синтез объединяет части в целое."

  - term: Параметрическое описание системы
    category: Методология
    definition: Представление системы через совокупность её параметров (входов, выходов, состояний) без детализации внутренней структуры.

  - term: Методика Черняка
    category: Методики структуризации
    definition: Методика структуризации целей и функций системы управления, основанная на анализе видов деятельности организации (Ю.И. Черняк).

  - term: Методика Перегудова-Сагатовского
    category: Методики структуризации
    definition: Методика структуризации целей, основанная на признаках «пространство инициирования целей» и «жизненный цикл» (Ф.И. Перегудов, В.Н. Сагатовский).

  - term: Методика Сагатовского-Дмитриева
    category: Методики структуризации
    definition: Методика структуризации целей и функций системы управления на основе концепции деятельности и её этапов.

  - term: Лицо, принимающее решение (ЛПР)
    category: Управление
    definition: Субъект, наделённый полномочиями выбирать альтернативу и нести ответственность за принятое решение.

  - term: Эксперт
    category: Управление
    definition: Специалист, привлекаемый для оценки альтернатив и выработки рекомендаций в условиях неопределённости.

  - term: Системный аналитик
    category: Управление
    definition: Специалист, организующий процесс системного анализа проблемы и готовящий решения для ЛПР.

  - term: Модель состава
    category: Методология
    definition: Модель системы, описывающая перечень её элементов и подсистем без указания связей между ними.

  - term: Модель структуры
    category: Методология
    definition: Модель системы, описывающая связи и отношения между её элементами.

  - term: Модель поведения
    category: Методология
    definition: Модель, описывающая изменение состояний системы во времени под воздействием входов и внутренних процессов.

  - term: Богданов А.А.
    category: Авторы
    definition: Русский учёный, автор «Тектологии» (1913–1922) — всеобщей организационной науки, предшественницы общей теории систем.

  - term: Берталанфи Л.
    category: Авторы
    definition: Австрийский биолог, основоположник общей теории систем (General System Theory), сформулированной в середине XX века.

  - term: Винер Н.
    category: Авторы
    definition: Американский математик, основатель кибернетики — науки об управлении и связи в животном и машине (1948).

  - term: Эшби У.Р.
    category: Авторы
    definition: Английский психиатр и кибернетик, автор закона необходимого разнообразия и работ по самоорганизующимся системам.

  - term: Перегудов Ф.И.
    category: Авторы
    definition: Советский учёный, соавтор учебников по системному анализу и методик структуризации целей организаций.

  - term: Уёмов А.И.
    category: Авторы
    definition: Советский философ, автор параметрической общей теории систем и двойственного определения системы.
